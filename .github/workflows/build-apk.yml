name: Build APK
on:
  workflow_dispatch:   # запуск вручную кнопкой Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Проект можно загрузить в репозиторий одним zip-файлом (удобно с телефона)
      - name: Locate project
        run: |
          if ls ./*.zip >/dev/null 2>&1; then unzip -q -o ./*.zip; fi
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Rust toolchain (>= 1.90)
        run: rustup update stable && rustup default stable && rustc --version

      - name: Build (cores + Rust + Gradle)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          chmod +x gradlew scripts/*.sh
          bash scripts/build-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: 123vpn-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
